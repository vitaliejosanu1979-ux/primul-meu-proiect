name: regenerare
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[site]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.js --root --base "${{ vars.SITE_BASE || 'https://vitaliejosanu1979-ux.github.io/primul-meu-proiect' }}"
      - run: |
          git config user.name "corpus-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -m "[site] regenerat" ) && git push
